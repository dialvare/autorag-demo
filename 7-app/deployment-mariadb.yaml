---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-demo-config
  namespace: ogx
  labels:
    app: chatbot
    app.kubernetes.io/name: chatbot
    app.kubernetes.io/part-of: ogx
data:
  INFERENCE_MODEL: redhataiqwen3-8b-fp8-dynamic
  OGX_CLIENT_BASE_URL: http://ogx-custom-server-service:8321/v1
  VECTOR_STORE_ID: pizza-bank-best-pattern
  OGX_RAG_MAX_RESULTS: "5"
  OGX_RAG_RANKER: weighted
  OGX_RAG_RANKER_ALPHA: "0.5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: ogx
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"v1","kind":"Service","name":"ogx-custom-server-service"}]'
  labels:
    app: chatbot
    app.kubernetes.io/name: chatbot
    app.kubernetes.io/component: chatbot
    app.kubernetes.io/part-of: ogx
    app.openshift.io/runtime: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
        app.kubernetes.io/name: chatbot
        app.kubernetes.io/part-of: ogx
    spec:
      containers:
        - name: chatbot
          image: quay.io/dialvare/chatbot:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
            requests:
              cpu: 250m
              memory: 500Mi
          env:
            - name: STREAMLIT_SERVER_FILE_WATCHER_TYPE
              value: none
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
            - name: STREAMLIT_SERVER_ENABLE_CORS
              value: "false"
            - name: MCP_SERVER_URL
              value: http://mariadbmcp.ogx.svc.cluster.local:9001/mcp
            - name: MCP_SERVER_LABEL
              value: mariadb-mcp
            - name: OGX_MAX_OUTPUT_TOKENS
              value: "1024"
            - name: OGX_MCP_MAX_OUTPUT_TOKENS
              value: "1024"
            - name: MCP_ALLOWED_TOOLS
              value: list_databases,list_tables,get_table_schema,get_table_schema_with_relations,execute_sql,create_database
          envFrom:
            - configMapRef:
                name: ogx-demo-config
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: ogx
  labels:
    app: chatbot
    app.kubernetes.io/name: chatbot
    app.kubernetes.io/part-of: ogx
spec:
  type: ClusterIP
  selector:
    app: chatbot
  ports:
    - name: http
      port: 8501
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: chatbot
  namespace: ogx
  labels:
    app: chatbot
    app.kubernetes.io/name: chatbot
    app.kubernetes.io/part-of: ogx
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: chatbot
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
