apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ogx-custom-server
  namespace: ogx
spec:
  distribution:
    name: rh
  workload:
    replicas: 1
    overrides:
      env:
        - name: POSTGRES_HOST
          value: postgres-service.ogx.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: ogx
        - name: POSTGRES_USER
          value: ogx
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: ENABLE_SENTENCE_TRANSFORMERS
          value: "false"
        - name: INFERENCE_MODEL
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: INFERENCE_MODEL
        - name: VLLM_URL
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: VLLM_URL
        - name: VLLM_TLS_VERIFY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: VLLM_TLS_VERIFY
        # Remote embedding model (vLLM / OpenShift AI predictor)
        - name: EMBEDDING_MODEL
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: EMBEDDING_MODEL
        - name: EMBEDDING_PROVIDER_MODEL_ID
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: EMBEDDING_PROVIDER_MODEL_ID
        - name: VLLM_EMBEDDING_URL
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: VLLM_EMBEDDING_URL
        - name: VLLM_EMBEDDING_TLS_VERIFY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: VLLM_EMBEDDING_TLS_VERIFY
        - name: MILVUS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: milvus-secret
              key: MILVUS_ENDPOINT
        - name: MILVUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: milvus-secret
              key: MILVUS_TOKEN
        - name: MILVUS_CONSISTENCY_LEVEL
          valueFrom:
            secretKeyRef:
              name: milvus-secret
              key: MILVUS_CONSISTENCY_LEVEL
      name: ogx
      port: 8321
    distribution:
      name: 'rh-dev'
    storage:
      size: 20Gi
      mountPath: /opt/app-root/src/.ogx/distributions/rh/