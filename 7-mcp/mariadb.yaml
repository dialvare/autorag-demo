---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb
  namespace: llamastack
  labels:
    app: mariadb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: llamastack
  labels:
    app: mariadb
    app.kubernetes.io/part-of: llamastack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: registry.redhat.io/rhel9/mariadb-1011
          ports:
            - containerPort: 3306
              protocol: TCP
          envFrom:
            - secretRef:
                name: mariadb
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql/data
            - name: init-sql
              mountPath: /var/lib/mysql/init
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb
        - name: init-sql
          configMap:
            name: mariadb-init
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: llamastack
  labels:
    app: mariadb
spec:
  selector:
    app: mariadb
  ports:
    - name: mariadb
      port: 3306
      targetPort: 3306
      protocol: TCP
---
# Secret for the MariaDB MCP server to connect to the database above.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-credentials
  namespace: llamastack
  labels:
    app: mcp-server
    mcp-server: mariadbmcp
type: Opaque
stringData:
  db-user: mcp_user
  db-password: mcp_pass
