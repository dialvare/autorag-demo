apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: mariadbmcp
  namespace: llamastack
  annotations:
    mcp.opendatahub.io/catalog-server: mariadb/mcp
    mcp.opendatahub.io/display-name: mariadb/mcp
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: quay.io/rhoai-partner-mcp/ubi10-mariadb-mcp:1774297776
  config:
    port: 9001
    path: /mcp
    arguments:
      - python
      - src/server.py
      - '--host'
      - 0.0.0.0
      - '--transport'
      - http
      - '--port'
      - '9001'
    env:
      - name: DB_HOST
        value: mariadb.llamastack.svc.cluster.local
      - name: DB_NAME
        value: mcp_db
      - name: ALLOWED_HOSTS
        value: "*"
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: mariadb-credentials
            key: db-user
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mariadb-credentials
            key: db-password
